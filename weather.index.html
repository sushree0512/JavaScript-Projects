<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel = 'stylesheet' href="weather.style.css">

</head>
<body>
    <div class = "card">
        <div class = "search">
            <input
                type = "text"
                placeholder="Enter city name"
                spellcheck="false">
            <button>
                <img src = "images/search.png" alt = "search">
            </button>
            
        </div>
        <div class = "error">
            <p>Invalid city name</p>
        </div>

        <div class = "weather">
            <img src = "images/drizzle.png" class = weather-icon>
            <h1 class = "temp">22°C</h1>
            <h2 class = "city">Bhubaneswar</h2>

            <div class = "details">
                <div class = "col">
                    <img src = "images/humidity.png" class = detail.icon>

                    <div>
                        <p class = "humidity">50%</p>
                        <p class = "detail-text">Humidity</p>
                    </div>

                <div class = "col">
                    <img src = "images/wind.png" class = detail.icon>

                    <div>
                        <p class = "wind">15 Km/h</p>
                        <p class = "detail-text">Wind Speed</p>
                    </div>   
                </div>            
            </div>
        </div>
    </div>

<script src = "weather.script.js"></script>

</body>
</html>
